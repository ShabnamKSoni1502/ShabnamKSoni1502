<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 184" width="490" height="184" role="img" aria-label="Project: DocQA"><title>Project: DocQA</title><style>
.serif{font-family:'HeroSerif',Georgia,'Times New Roman',serif}
.sans{font-family:'HeroSans','Segoe UI',Helvetica,Arial,sans-serif}
.rise,.pop,.swing,.pulse,.ring,.nudge{transform-box:fill-box;transform-origin:center}
.grow{transform-box:fill-box;transform-origin:bottom}
.growx{transform-box:fill-box;transform-origin:left}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(36px) rotate(-3deg)}60%{opacity:1;transform:translateY(-6px) rotate(.5deg)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.grow{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.growx{animation:growx .7s cubic-bezier(.2,.8,.2,1) both}
.swing{animation:swing 1s cubic-bezier(.2,.8,.2,1) both}
.pulse{animation:pulse 1.8s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite}
.nudge{animation:nudge 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="488" height="182" rx="20" fill="#FAF7F0" stroke="#D9D6D0" stroke-width="2"/>
<g class="rise" style="animation-delay:4.10s">
  <text class="serif" x="26" y="50" font-size="28" fill="#1B1B1B">DocQA</text>
  <g transform="translate(446,30)"><path class="nudge" d="M0 14 L14 0 M3 0 H14 V11" fill="none"
     stroke="#2F5BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="sans" x="26" y="80" font-size="14" fill="#7F7E7B">Ask questions about your PDFs. Answers cite the page</text><text class="sans" x="26" y="100" font-size="14" fill="#7F7E7B">they came from.</text><rect x="26.0" y="136" width="73.8" height="26" rx="13" fill="#E2E4F2"/><text class="sans" x="62.9" y="153" font-size="12" text-anchor="middle" fill="#2F5BFF">FastAPI</text><rect x="107.8" y="136" width="81.2" height="26" rx="13" fill="#E2E4F2"/><text class="sans" x="148.4" y="153" font-size="12" text-anchor="middle" fill="#2F5BFF">ChromaDB</text><rect x="197.0" y="136" width="44.2" height="26" rx="13" fill="#E2E4F2"/><text class="sans" x="219.1" y="153" font-size="12" text-anchor="middle" fill="#2F5BFF">RAG</text><rect x="249.2" y="136" width="59.0" height="26" rx="13" fill="#E2E4F2"/><text class="sans" x="278.7" y="153" font-size="12" text-anchor="middle" fill="#2F5BFF">React</text>
</g>
</svg>
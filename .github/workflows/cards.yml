name: Refresh README cards

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 6:00 AM IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
        env:
          # Uses GH_PAT if you add that secret, otherwise the built-in token
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Render README cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
